# Single-tenant local Postgres for contextual. Full-text (tsvector) and vectors
# (pgvector) live in one database so hybrid retrieval is one SQL statement.
services:
  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONTEXTUAL_DATABASE_URL: postgres://contextual:contextual@db:5432/contextual
      CONTEXTUAL_OCR: local
      CONTEXTUAL_OCR_LANGUAGE: ${CONTEXTUAL_OCR_LANGUAGE:-eng}
      CONTEXTUAL_EMBED_PROVIDER: ${CONTEXTUAL_EMBED_PROVIDER:-none}
      CONTEXTUAL_OLLAMA_URL: ${CONTEXTUAL_OLLAMA_URL:-http://host.docker.internal:11434}
      CONTEXTUAL_HTTP_TOKEN: ${CONTEXTUAL_HTTP_TOKEN:-}
      CONTEXTUAL_HTTP_ALLOWED_HOSTS: ${CONTEXTUAL_HTTP_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - contextual-blobs:/app/blobs
  db:
    image: pgvector/pgvector:0.8.6-pg17
    shm_size: 1gb
    restart: unless-stopped
    container_name: contextual-db
    environment:
      POSTGRES_USER: contextual
      POSTGRES_PASSWORD: contextual
      POSTGRES_DB: contextual
    # Keep Postgres on loopback: these are development credentials.
    # The HTTP service has its own bearer authentication.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - contextual-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextual -d contextual"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  contextual-pgdata:
  contextual-blobs:
